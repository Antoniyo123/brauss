    <!-- Responsive -->

    <!-- Basic SEO -->
    <title>Brauss Networks</title>

      name="description"
      content="Brauss Networks is a creative house developing original ideas, brand experiences and intellectual properties with long-term value."

    <!-- Open Graph (for WhatsApp / LinkedIn / Discord preview) -->
    <meta property="og:title" content="Brauss Networks" />

      property="og:description"
      content="Creative house developing ideas, brand experiences and intellectual properties."

      name="twitter:description"
