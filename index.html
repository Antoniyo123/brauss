<!doctype html>
<html lang="en">
<head>

<meta charset="UTF-8" />

<!-- Viewport -->
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!-- Title -->
<title>Brauss Networks</title>

<!-- SEO Description -->
<meta
  name="description"
  content="Brauss Networks is a creative house developing original ideas, brand experiences and intellectual properties with long-term value."
/>

<!-- Author -->
<meta name="author" content="Brauss Networks" />

<!-- Robots -->
<meta name="robots" content="index, follow" />

<!-- Canonical -->
<link rel="canonical" href="https://braussnetworks.com/" />

<!-- Favicon -->
<!-- ================= Favicons ================= -->

<link rel="icon" type="image/png" href="/logo-white (1).png" sizes="32x32">
<link rel="icon" type="image/png" href="/logo-white (1).png" sizes="192x192">
<link rel="apple-touch-icon" href="/logo-white (1).png">

<!-- ================= Open Graph ================= -->

<meta property="og:title" content="Brauss Networks" />
<meta property="og:description" content="Creative house developing ideas, brand experiences and intellectual properties." />
<meta property="og:image" content="https://braussnetworks.com/og-image.png" />
<meta property="og:url" content="https://braussnetworks.com/" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Brauss Networks" />

<!-- ================= Twitter Card ================= -->

<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Brauss Networks" />
<meta name="twitter:description" content="Creative house developing ideas, brand experiences and intellectual properties." />
<meta name="twitter:image" content="https://braussnetworks.com/og-image.png" />

<!-- ================= Theme Color ================= -->

<meta name="theme-color" content="#000000" />

<!-- ================= Structured Data ================= -->

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "Brauss Networks",
  "url": "https://braussnetworks.com",
  "logo": {
    "@type": "ImageObject",
    "url": "https://braussnetworks.com/logobraus.png",
    "width": 512,
    "height": 512
  },
  "sameAs": [
    "https://instagram.com/braussnetworks",
    "https://linkedin.com/company/braussnetworks"
  ]
}
</script>

</head>

<body>

<div id="root"></div>

<script type="module" src="/src/main.jsx"></script>

</body>
</html>
