<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>BRAUSS Creative</title>
  <meta name="description" content="BRAUSS — Creative direction, visual identity, and brand experiences." />

  <!-- Open Graph -->
  <meta property="og:title" content="BRAUSS" />
  <meta property="og:description" content="Creative direction and brand experiences." />
  <meta property="og:image" content="/og-brauss.png" />
  <meta property="og:type" content="website" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="BRAUSS" />
  <meta name="twitter:description" content="Creative direction and brand experiences." />
  <meta name="twitter:image" content="/og-brauss.png" />

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      background:#0a0a0a;
      color:white;
      display:flex;
      align-items:center;
      justify-content:center;
      height:100vh;
      text-align:center;
    }

    .container{
      max-width:900px;
      padding:40px;
    }

    .logo{
      width:420px;
      max-width:90%;
      margin-bottom:40px;
    }

    h1{
      font-size:48px;
      letter-spacing:-1px;
      margin-bottom:20px;
    }

    p{
      font-size:18px;
      opacity:0.7;
      line-height:1.6;
      max-width:520px;
      margin:auto;
    }

    .cta{
      margin-top:40px;
    }

    .cta a{
      display:inline-block;
      padding:14px 28px;
      border-radius:40px;
      text-decoration:none;
      background:#7b4cff;
      color:white;
      font-weight:500;
      transition:0.3s;
    }

    .cta a:hover{
      transform:translateY(-2px);
      box-shadow:0 10px 30px rgba(123,76,255,0.4);
    }

    footer{
      position:absolute;
      bottom:20px;
      font-size:12px;
      opacity:0.5;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- Logo -->
    <img src="/brauss-logo.png" class="logo" alt="BRAUSS logo">

    <h1>BRAUSS</h1>

    <p>
      A creative house focused on visual identity, digital presence, 
      and brand experiences with long-term cultural value.
    </p>

    <div class="cta">
      <a href="mailto:hello@brauss.studio">Get in touch</a>
    </div>

  </div>

  <footer>
    © 2022 BRAUSS
  </footer>

</body>
</html>
